name: publish-distribution

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate tag and csproj version match
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content -Path .\CsvLauncher\CsvLauncher.csproj
          $csprojVersion = ($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($csprojVersion)) {
            Write-Error "Version was not found in CsvLauncher/CsvLauncher.csproj"
            exit 1
          }

          $tagVersion = "${{ github.ref_name }}"
          if ($tagVersion.StartsWith('v')) {
            $tagVersion = $tagVersion.Substring(1)
          }

          if ($tagVersion -ne $csprojVersion) {
            Write-Error "Tag version ($tagVersion) does not match csproj version ($csprojVersion)."
            exit 1
          }

      - name: Validate required secrets
        if: ${{ secrets.GOOGLE_CLIENT_ID == '' || secrets.GOOGLE_CLIENT_SECRET == '' }}
        shell: pwsh
        run: |
          Write-Error "Missing required secrets: GOOGLE_CLIENT_ID and/or GOOGLE_CLIENT_SECRET"
          exit 1

      - name: Create credentials.json from secrets
        shell: pwsh
        run: |
          $json = @"
          {
            "installed": {
              "client_id": "${{ secrets.GOOGLE_CLIENT_ID }}",
              "project_id": "${{ secrets.GOOGLE_PROJECT_ID }}",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token",
              "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
              "client_secret": "${{ secrets.GOOGLE_CLIENT_SECRET }}",
              "redirect_uris": [
                "http://localhost"
              ]
            }
          }
          "@
          Set-Content -Path credentials.json -Value $json -Encoding UTF8

      - name: Build distribution
        shell: pwsh
        run: dotnet msbuild .\CsvLauncher\CsvLauncher.csproj -t:PublishDistribution

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CsvLauncher-dist
          path: |
            dist/CsvLauncher.exe
            dist/CsvLauncher-*.zip
            dist/setup.ps1
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CsvLauncher-*.zip
          generate_release_notes: true

      - name: Cleanup credentials.json
        if: always()
        shell: pwsh
        run: |
          if (Test-Path credentials.json) {
            Remove-Item credentials.json -Force
          }
